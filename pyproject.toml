[project]
name = "karl-vk-bot"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<4.0"
package-mode = false
dependencies = [
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "vkbottle (>=4.7.0,<5.0.0)",
    "vkbottle-types (>=5.199.99.12,<6.0.0.0)",
    "punq (>=0.7.0,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "openai (>=2.30.0,<3.0.0)",
    "orjson (>=3.11.8,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.1,<5.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "faker (>=40.11.1,<41.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 120
lines_after_imports = 2
lines_between_sections = 1
lines_between_types = 0
force_alphabetical_sort_within_sections = true
ensure_newline_before_comments = true
combine_as_imports = true
combine_star = true
skip_gitignore = true
balanced_wrapping = true
force_grid_wrap = 2
src_paths = ["src"]
skip_glob = [
    ".git",
    ".idea",
    ".vscode",
    "venv",
    ".venv",
]
known_vkbottle = ["vkbottle"]
known_first_party = ["src"]
sections = [
    "FUTURE",
    "STDLIB",
    "VKBOTTLE",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]